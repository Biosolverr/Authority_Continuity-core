<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authority Console | GenLayer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#03060d;--panel:#080e1d;--card:#0b1328;--line:#15213d;--fg:#e8eeff;--mute:#8393b8;--dim:#34456e;--blue:#3d7bff;--sky:#8fb4ff;--err:#ff6b81;--sans:'Schibsted Grotesk',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(1200px 500px at 85% -10%,#0d1c44 0,transparent 60%),var(--bg);color:var(--fg);font:14px/1.45 var(--sans);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
header{flex:none;position:sticky;top:0;z-index:20;background:rgba(5,9,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--blue);box-shadow:0 1px 24px rgba(61,123,255,.18)}
.bar1{display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px;letter-spacing:-.02em;margin-right:auto}
.brand i{font-style:normal;color:var(--mute);font-weight:400;margin-left:10px;font-size:13px}
.chip{border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:7px;background:var(--panel)}
.chip b{color:var(--fg);font-weight:500;font-family:var(--mono);font-size:12px}
.chip.ok{border-color:var(--blue)}.chip.bad{border-color:var(--err)}.chip.bad b{color:var(--err)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--blue);box-shadow:0 0 8px var(--blue)}.dot.paused{background:none;border:2px solid var(--sky)}
.btn{border:1px solid var(--blue);background:var(--blue);color:#fff;border-radius:99px;padding:8px 18px;font-weight:700;transition:background .15s}
.btn:hover{background:#5a91ff}.btn[disabled]{opacity:.45;cursor:wait}
.btn.ghost{background:none;color:var(--fg);border-color:var(--dim)}.btn.ghost:hover{border-color:var(--sky);background:rgba(61,123,255,.1)}
.btn.sm{padding:3px 11px;font-size:12px;font-weight:500}
#bCol{display:none}
.conn{display:grid;grid-template-columns:150px 1.1fr 1.4fr 1.3fr 1.3fr 1.3fr;gap:10px;padding:0 20px 12px}
.conn label{display:block;font-size:11.5px;color:var(--mute);margin-bottom:3px}
.conn input,.conn select,.f input,.f select,.f textarea,.q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-family:var(--mono);font-size:12.5px}
.conn input:focus,.conn select:focus,.f input:focus,.f select:focus,.f textarea:focus,.q:focus{border-color:var(--blue);outline:0;box-shadow:0 0 0 3px rgba(61,123,255,.22)}
.conn .bad,.f .bad{border-color:var(--err)}
.pkrow{display:flex;gap:6px}.pkrow button{flex:none}
#msg{padding:0 20px 10px;font-size:12.5px;color:var(--err);display:none}
main{flex:1;display:grid;grid-template-columns:290px minmax(0,1fr) 340px;min-height:0}
section{min-height:0;overflow:auto;scrollbar-width:thin;scrollbar-color:#1c2c52 transparent}
nav{border-right:1px solid var(--line);background:var(--panel)}
.stage{padding:28px 32px}
.tape{border-left:1px solid var(--line);padding:16px;background:var(--panel)}
.navtop{position:sticky;top:0;background:var(--panel);z-index:2;padding:14px 16px 8px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--dim);border-radius:99px;padding:3px;margin-bottom:10px}
.tabs button{border:0;background:none;border-radius:99px;padding:7px 4px;font-size:12.5px;font-weight:500;color:var(--mute)}
.tabs button small{opacity:.7;margin-left:4px}
.tabs button.on{background:var(--blue);color:#fff}
.grp{padding:2px 12px 8px}
.grp h4{font-weight:500;color:var(--mute);font-size:12.5px;padding:10px 8px 5px;display:flex;justify-content:space-between}
.m{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;font-family:var(--mono);font-size:12.5px;color:#cdd8f5}
.m:hover{background:#0f1a36}
.m.on{background:var(--blue);color:#fff}
.g{flex:none;width:10px;height:10px;border:1.5px solid var(--sky);border-radius:50%}
.g.w{background:var(--blue);border-color:var(--blue);border-radius:2px}
.g.p{background:var(--sky);border-color:var(--sky);border-radius:2px;box-shadow:0 0 0 2px var(--panel),0 0 0 3.5px var(--sky)}
.m.on .g{border-color:#fff}.m.on .g.w,.m.on .g.p{background:#fff}
h1{font-size:30px;letter-spacing:-.03em;line-height:1.1;font-weight:700}
.sub{color:var(--mute);margin:8px 0 22px;max-width:62ch}
.kind{display:inline-block;border:1px solid var(--blue);border-radius:99px;padding:1px 10px;font-size:12px;color:var(--sky);margin-bottom:12px}
.f{margin-bottom:16px;max-width:620px}
.f label{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mute);margin-bottom:5px}
.f label span{font-family:var(--mono)}
.f textarea{min-height:76px;resize:vertical}
.chips{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.hsrc{margin-top:6px}.hsrc textarea{min-height:46px;font-size:12px}
.row{display:flex;gap:10px;align-items:center;margin-top:22px}
.out{margin-top:26px;max-width:760px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.out>div{padding:10px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
.out pre{padding:16px;font:12.5px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:340px;overflow:auto}
.out.err{border-color:var(--err)}.out.err pre{color:var(--err)}
details{padding:0 16px 14px;color:var(--mute);font-size:12.5px}summary{cursor:pointer;padding:12px 0 6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;max-width:780px;margin:24px 0}
.card{border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:12px;padding:16px;background:var(--card)}
.card .n{font-size:34px;font-weight:700;letter-spacing:-.03em;color:var(--sky)}
.card p{color:var(--mute);font-size:13px}
ol.fl{color:var(--mute);padding-left:20px;max-width:66ch;margin-bottom:24px}ol.fl li{padding:3px 0}ol.fl b{color:var(--fg);font-weight:500;font-family:var(--mono);font-size:12.5px}
.tape h3{font-size:14px;font-weight:500;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.t{border-top:1px dashed var(--dim);padding:10px 2px;cursor:pointer}
.t:hover .tn{color:var(--sky)}
.t .tn{font-family:var(--mono);font-size:12.5px;display:flex;gap:8px;align-items:center}
.t .tm{color:var(--mute);font-size:12px;margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.t .tr{font:11.5px/1.4 var(--mono);color:#b9c8ee;margin-top:6px;white-space:pre-wrap;word-break:break-all;max-height:84px;overflow:hidden}
.t.err .tn{color:var(--err)}
.spin{width:10px;height:10px;border:2px solid var(--dim);border-top-color:var(--sky);border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.empty{color:var(--mute);font-size:13px;padding:14px 0;border-top:1px dashed var(--dim)}
@media(max-width:1100px){body{overflow:auto}main{display:block}section{overflow:visible}nav,.tape{border:0;border-top:1px solid var(--line)}.stage{padding:22px 16px}.conn{grid-template-columns:1fr 1fr}#bCol{display:inline-block}.conn.closed,.conn.closed~#none{display:none}}
@media(max-width:560px){.conn{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}.btn{transition:none}}
</style>
</head>
<body>
<header>
  <div class="bar1">
    <div class="brand">Authority Console<i>AuthorityLedger + ProtectedProtocol + ContinuityCore</i></div>
    <div class="chip" id="cSdk" style="cursor:pointer" title="Click to retry loading the SDK">SDK <b>...</b></div>
    <div class="chip" id="cAcc">account <b>none</b></div>
    <div class="chip" id="cPause"><span class="dot"></span><b>protocol: no address</b></div>
    <button class="btn sm" id="bConn">Connect</button>
    <button class="btn ghost sm" id="bCol">Connection</button>
  </div>
  <div class="conn" id="conn">
    <div><label for="sChain">Network</label><select id="sChain"><option>studionet</option><option>localnet</option><option>testnetAsimov</option></select></div>
    <div><label for="iRpc">RPC (optional)</label><input id="iRpc" placeholder="http://localhost:4000/api" autocomplete="off" spellcheck="false"></div>
    <div><label for="iPk">Private key (kept in this browser only)</label><div class="pkrow"><input id="iPk" type="password" placeholder="0x..." autocomplete="off" spellcheck="false"><button class="btn ghost sm" id="bShow" type="button">Show</button><button class="btn ghost sm" id="bNew" type="button">New</button></div></div>
    <div><label for="iL">AuthorityLedger</label><input id="iL" placeholder="0x..." autocomplete="off" spellcheck="false"></div>
    <div><label for="iP">ProtectedProtocol</label><input id="iP" placeholder="0x..." autocomplete="off" spellcheck="false"></div>
    <div><label for="iC">ContinuityCore</label><input id="iC" placeholder="0x..." autocomplete="off" spellcheck="false"></div>
  </div>
  <div id="msg"></div>
</header>
<main>
  <nav><section id="nav" style="height:100%"></section></nav>
  <section class="stage" id="stage"></section>
  <section class="tape"><h3>Call tape <button class="btn ghost sm" id="bClr">Clear</button></h3><div id="tape"></div></section>
</main>

<script type="module">
/* ========= 1. Methods: 36 (Ledger) + 32 (Protocol) + 28 (ContinuityCore) = 96 ========= */
// m(contract, name, kind[r|w|p], group, "params", description)
// param types: s string, i int, b bool, a address, t text, h sha256 hash, ts unix time, id id (64 hex or EV-1), cap capability, v amount (wei), l list
const m=(c,n,k,g,p,d)=>({c,n,k,g,d,ps:p?p.split(',').map(x=>{const[a,b]=x.trim().split(':');return{n:a,t:b||'s'}}):[]});
const METHODS=[
 m("L","set_protected_protocol_address","w","Setup","protected_protocol_address:a","Owner, once: link the Ledger to ProtectedProtocol."),
 m("L","create_delegation","w","Delegations","delegate:a,capability:cap,scope:s,valid_from:ts,valid_until:ts,max_depth:i,intent_hash:h,revocable:b","Grant authority. Returns delegation_id and flags scope overlaps."),
 m("L","redelegate","w","Delegations","parent_id:id,new_delegate:a,valid_from:ts,valid_until:ts,intent_hash:h,revocable:b","Delegate passes authority on, within the parent window and max_depth."),
 m("L","revoke_delegation","w","Delegations","delegation_id:id","Grantor revokes a delegation (if revocable)."),
 m("L","get_delegation","r","Delegations","delegation_id:id","Full delegation record."),
 m("L","is_delegation_valid","r","Delegations","delegation_id:id,actor:a,capability:cap,scope:s","Is the delegation active for this actor right now."),
 m("L","get_potential_conflicts","r","Conflicts","delegation_id:id","Delegations flagged by the scan as possible conflicts."),
 m("L","resolve_conflict","w","Conflicts","delegation_id_a:id,delegation_id_b:id,intent_text_a:t,intent_text_b:t","LLM judgment: CONFLICT / NO_CONFLICT / INCONCLUSIVE. Texts must match intent_hash."),
 m("L","get_conflict","r","Conflicts","delegation_id_a:id,delegation_id_b:id","Stored decision for a pair."),
 m("L","create_request","w","Requests","delegation_id:id,capability:cap,scope:s,intent_hash:h,justification_hash:h,ttl_seconds:i","Delegate requests an action. Blocked by a confirmed CONFLICT."),
 m("L","expire_request","w","Requests","request_id:id","Close an expired request."),
 m("L","cancel_request","w","Requests","request_id:id","Requester cancels their own request."),
 m("L","get_request","r","Requests","request_id:id","Request record and status."),
 m("L","adjudicate","w","Verdicts","request_id:id,intent_text:t,justification_text:t,valid_seconds:i","AI verdict IN_SCOPE / OUT_OF_SCOPE / INCONCLUSIVE, for requests WITHOUT a bound action."),
 m("L","get_verdict","r","Verdicts","request_id:id","Verdict, expiry and precedent_flag."),
 m("L","appeal_verdict","w","Verdicts","request_id:id,intent_text:t,new_justification_text:t,valid_seconds:i","One appeal, only after INCONCLUSIVE. Strict mode: doubt = OUT_OF_SCOPE."),
 m("L","adjudicate_action","w","Verdicts","request_id:id,intent_text:t,action_text:t,justification_text:t,valid_seconds:i","Verdict on the EXACT action: the AI sees action_text (sha256 = action_params_hash). Required for requests with params."),
 m("L","appeal_action_verdict","w","Verdicts","request_id:id,intent_text:t,action_text:t,new_justification_text:t,valid_seconds:i","Appeal for a request with a bound action (once, after INCONCLUSIVE)."),
 m("L","check_authority","r","Target adapter","request_id:id,actor:a,capability:cap,action_params_hash:t","Universal check: authorized + reason. Leave action_params_hash empty if the request has no params."),
 m("L","create_request_with_params","w","Target adapter","delegation_id:id,capability:cap,scope:s,intent_hash:h,justification_hash:h,ttl_seconds:i,action_params_hash:h","Request bound to action_params_hash = sha256 of the canonical action text. Judge it via adjudicate_action."),
 m("L","register_capability","w","Capability registry","name:s,description:s,min_severity:i","Owner adds a capability. Name: A-Z, 0-9, _. min_severity gates the AI call."),
 m("L","register_capability_with_assurance","w","Capability registry","name:s,description:s,min_severity:i,assurance_level:i","As above, with consequence class: 0 ROUTINE (no AI), 1 SENSITIVE, 2 CRITICAL."),
 m("L","set_capability_assurance","w","Capability registry","name:s,assurance_level:i","Owner can only RAISE the consequence class."),
 m("L","set_continuity_address","w","Gates","continuity_address:a","Owner, once: ContinuityCore address. Verified by a probe read."),
 m("L","require_gate_for_capability","w","Gates","name:s","Owner makes gates mandatory for a capability (cannot be undone)."),
 m("L","create_request_gated","w","Gates","delegation_id:id,capability:cap,scope:s,intent_hash:h,justification_hash:h,ttl_seconds:i,action_params_hash:t,gate_action_id:s","Request with a gate: id of an ACTION node in ContinuityCore (e.g. AC-1). action_params_hash may be empty."),
 m("L","get_gate_status","r","Gates","request_id:id","Is the request gate open now, and why not (GATE_CLOSED / GATE_UNAVAILABLE)."),
 m("L","get_capability","r","Capability registry","name:s","One capability: description, threshold, class."),
 m("L","list_capabilities","r","Capability registry","","All capabilities (feeds the capability fields)."),
 m("L","set_delegation_limit","w","Limits & approvals","delegation_id:id,max_requests:i","Grantor caps the number of requests once (1 = one-shot)."),
 m("L","require_approvals","w","Limits & approvals","delegation_id:id,approvers_csv:t,required:i","Committee: comma-separated addresses, M approvals needed before the delegation is active."),
 m("L","approve_delegation","w","Limits & approvals","delegation_id:id","Committee member approves the delegation."),
 m("L","list_requests_of_delegation","r","Audit","delegation_id:id,offset:i,limit:i","Requests of a delegation (page up to 50)."),
 m("L","list_delegations_of_scope","r","Audit","scope:s,offset:i,limit:i","Delegations on a scope."),
 m("L","list_delegations_of_delegate","r","Audit","delegate:a,offset:i,limit:i","All delegations of a delegate."),
 m("L","get_stats","r","Audit","","Counters: delegations, requests, verdicts."),
 m("P","set_ledger_address","w","Setup","ledger_address:a","Owner, once: link the protocol to the Ledger."),
 m("P","add_severity_reporter","w","Severity","reporter:a","Owner adds a trusted reporter."),
 m("P","remove_severity_reporter","w","Severity","reporter:a","Owner disables a reporter."),
 m("P","report_severity","w","Severity","score:i","Reporter publishes an incident severity score."),
 m("P","get_risk_snapshot","r","Severity","","Median of fresh reports and the latest time."),
 m("P","get_severity_report","r","Severity","reporter:a","Latest report of one reporter."),
 m("P","pause_via_verdict","w","Verdict actions","request_id:id","Pause the protocol with an IN_SCOPE verdict (called by the delegate)."),
 m("P","unpause_via_verdict","w","Verdict actions","request_id:id","Unpause with an IN_SCOPE verdict."),
 m("P","set_slash_recipient","w","Slashing","recipient:a","Owner, once: who receives slashed bonds."),
 m("P","sweep_slashed","w","Slashing","","Anyone: send accumulated slashes to the set recipient only."),
 m("P","get_slash_info","r","Slashing","","Slash recipient and pending amount."),
 m("C","register_evidence","w","Evidence","claim:s,source_url:s,ttl_seconds:i","Register a claim with an https source and a lifetime (60 s - 1 year)."),
 m("C","verify_evidence","w","Evidence","evidence_id:id","Validators read the source and decide if it supports the claim. SUPPORTED starts the lease."),
 m("C","revalidate","w","Evidence","evidence_id:id","Re-check after expiry: SAME / CHANGED / CONTRADICTED. Only in REVALIDATION_PENDING."),
 m("C","reclaim","w","Evidence","evidence_id:id,new_claim:s","Owner restates a claim after EXPIRED / INVALIDATED (not if other nodes depend on it)."),
 m("C","register_judge","w","Judges","description:s,labels:l,ttl_seconds:i","AI judge with a closed label set (2-8, A-Z0-9_). List like [\"APPROVE\",\"REJECT\"]."),
 m("C","add_golden","w","Judges","judge_id:id,input_text:t,expected_label:s","Golden case, append-only (3-8 cases, input 8-800 chars)."),
 m("C","propose_version","w","Judges","judge_id:id,prompt_text:t","Prompt version. Needs the {input} marker; golden texts must not appear in it."),
 m("C","run_case","w","Judges","judge_id:id,version_no:i,case_idx:i","Validators run the prompt on one golden case; PASS if the label matches."),
 m("C","activate_version","w","Judges","judge_id:id,version_no:i","Activate a version if every case PASSed recently (within 1 hour)."),
 m("C","finalize_recert","w","Judges","judge_id:id","Finish re-certification of the active version after expiry."),
 m("C","poll","w","Leases & revocation","lease_id:id","Sync stored lease state with time (ACTIVE > EXPIRING > EXPIRED)."),
 m("C","request_revalidation","w","Leases & revocation","lease_id:id","EXPIRED (anyone) or EXPIRING (owner) moves to REVALIDATION_PENDING."),
 m("C","revoke","w","Leases & revocation","lease_id:id","Owner revokes an evidence or judge: INVALIDATED, dependents are blocked."),
 m("C","derive_assertion","w","Dependency graph","statement:s,parent_ids:l","Derive a statement from facts. parent_ids: [\"EV-1\"] or EV-1, EV-2 (up to 8)."),
 m("C","derive_action","w","Dependency graph","description:s,parent_ids:l,max_age_seconds:i","Gate node: action allowed while all facts are fresh. max_age 0 = no age limit."),
 m("C","refresh_node","w","Dependency graph","node_id:id","Persist the effective state of a node (cache and log)."),
 m("C","execute_action","w","Dependency graph","action_id:id","Owner executes the action if all facts below it are fresh. One-shot: closes the gate for the Ledger."),
 m("C","get_state","r","Reads","node_id:id","Effective state of a node right now."),
 m("C","get_blocker","r","Reads","node_id:id","Which fact blocks the node (empty if none)."),
 m("C","can_execute","r","Reads","action_id:id","Is the gate open. This is what the Ledger asks."),
 m("C","get_node","r","Reads","node_id:id","Full node record: state, timing, last verdict."),
 m("C","get_golden","r","Reads","judge_id:id,idx:i","One golden case of a judge."),
 m("C","get_version","r","Reads","judge_id:id,version_no:i","Prompt version and its state."),
 m("C","get_result","r","Reads","judge_id:id,version_no:i,idx:i","Case run result: label, time, PASS or FAIL."),
 m("C","get_active_prompt","r","Reads","judge_id:id","Active prompt, its version, and whether the judge is live."),
 m("C","get_parents","r","Reads","node_id:id","Parents of a node."),
 m("C","get_children","r","Reads","node_id:id,offset:i,limit:i","Children of a node (page up to 100)."),
 m("C","get_log","r","Reads","offset:i,limit:i","State transition log."),
 m("P","get_status","r","Verdict actions","","Current state: paused and paused_at."),
 m("P","get_execution_status","r","Verdict actions","request_id:id","Was this request already executed."),
 m("P","add_guardian","w","Guardians & bonds","guardian:a","Owner adds a guardian."),
 m("P","remove_guardian","w","Guardians & bonds","guardian:a","Owner disables a guardian."),
 m("P","deposit_bond","p","Guardians & bonds","value:v","Deposit a bond (payable). Minimum to sign a pause: 0.1 GEN = 10^17 wei."),
 m("P","withdraw_bond","w","Guardians & bonds","amount:i","Withdraw bond if no unresolved pauses."),
 m("P","get_bond","r","Guardians & bonds","guardian:a","Bond size."),
 m("P","get_active_signed_count","r","Guardians & bonds","guardian:a","Unresolved pauses signed by the guardian."),
 m("P","propose_pause","w","Guardian pause","justification_text:t","Guardian proposes a fast pause (bond required)."),
 m("P","sign_pause","w","Guardian pause","pause_id:id","Sign a pause; it executes at the N-of-M threshold."),
 m("P","link_ratification_request","w","Guardian pause","pause_id:id,request_id:id","Attach a ratification request (RATIFY_GUARDIAN_PAUSE; justification_hash = sha256 of the pause text)."),
 m("P","resolve_ratification","w","Guardian pause","pause_id:id","Read the verdict; if not IN_SCOPE, slash and unpause."),
 m("P","get_proposal","r","Guardian pause","pause_id:id","State of a proposed pause."),
 m("P","propose_threshold_change","w","Threshold N-of-M","new_threshold:i","Guardian proposes a new threshold."),
 m("P","vote_threshold_change","w","Threshold N-of-M","proposal_id:id","Vote for a threshold change (majority needed)."),
 m("P","get_threshold_proposal","r","Threshold N-of-M","proposal_id:id","Votes and state of the proposal."),
 m("P","canonical_threshold_payload","r","Critical action","new_threshold:i","Exact action text for a threshold change (depends on the CURRENT threshold). Hash it into action_params_hash and show it to the AI in adjudicate_action."),
 m("P","propose_critical_threshold_change","w","Critical action","request_id:id,new_threshold:i","Delegate with an IN_SCOPE verdict on CHANGE_GUARDIAN_THRESHOLD proposes a threshold. The target computes the action hash itself."),
 m("P","approve_critical_action","w","Critical action","request_id:id","Guardian approves; at the current threshold, authority is re-checked and the threshold changes."),
 m("P","get_critical_action","r","Critical action","request_id:id","Votes, required count, expiry and status of a critical proposal."),
 m("P","get_guardians","r","Guardians & bonds","","Active guardians and the current threshold."),
];
const CAPS=['PAUSE_PROTOCOL','UNPAUSE_PROTOCOL','RATIFY_GUARDIAN_PAUSE','CHANGE_GUARDIAN_THRESHOLD'];
const CN={L:'AuthorityLedger',P:'ProtectedProtocol',C:'ContinuityCore'};
const TAB={L:'Ledger',P:'Protocol',C:'Continuity'};

/* ========= 2. Utilities and state ========= */
const $=s=>document.querySelector(s);
const h=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,y]of Object.entries(a)){if(x.startsWith('on'))e[x]=y;else if(x==='class')e.className=y;else if(y!==false&&y!=null)e.setAttribute(x,y)}e.append(...k.flat().filter(v=>v!=null));return e};
const LS=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||'';localStorage.setItem(k,v)}catch{return ''}};
const cfg={chain:LS('chain')||'studionet',rpc:LS('rpc'),pk:LS('pk'),L:LS('addrL'),P:LS('addrP'),C:LS('addrC')};
const st={tab:'L',sel:null,tape:[],ids:new Set(),n:0};
let GL,CH={},client=null,me='';

const hex=b=>'0x'+[...b].map(x=>x.toString(16).padStart(2,'0')).join('');
const ser=v=>v instanceof Map?Object.fromEntries([...v].map(([k,x])=>[k,ser(x)])):Array.isArray(v)?v.map(ser):typeof v==='bigint'?v.toString():v instanceof Uint8Array?hex(v):v&&typeof v==='object'?(Object.getPrototypeOf(v)===Object.prototype?Object.fromEntries(Object.entries(v).map(([k,x])=>[k,ser(x)])):String(v)):v;
const pretty=v=>typeof v==='string'?v:JSON.stringify(v,null,2);
const sha=async t=>hex(new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))).slice(2);
const short=a=>a?a.slice(0,6)+'…'+a.slice(-4):'—';
const scanIds=o=>{const t=JSON.stringify(o)||'';t.match(/\b[0-9a-f]{64}\b/g)?.forEach(i=>st.ids.add(i));t.match(/\b(?:EV|AS|AC|JD)-\d+\b/g)?.forEach(i=>st.ids.add(i))};


st.q='';
const ADDR=/^0x[0-9a-fA-F]{40}$/,PK=/^0x[0-9a-fA-F]{64}$/;

/* ========= 3. Connection (genlayer-js) ========= */
let sig='',sdkP=null;
const chip=(id,t,c)=>{const e=$('#'+id);e.querySelector('b').textContent=t;e.className='chip '+(c||'')};
const say=t=>{const e=$('#msg');e.textContent=t||'';e.style.display=t?'block':'none'};
const tmo=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
function fillChains(){
  const ks=Object.keys(CH).filter(k=>CH[k]&&typeof CH[k]==='object'&&(CH[k].id!==undefined||CH[k].name));
  if(ks.length)$('#sChain').replaceChildren(...ks.map(k=>h('option',{value:k,selected:k===cfg.chain},k)));
}
function loadSdk(){
  if(sdkP)return sdkP;
  return sdkP=(async()=>{
    chip('cSdk','loading...');
    const src=[['https://esm.sh/genlayer-js','https://esm.sh/genlayer-js/chains'],['https://cdn.jsdelivr.net/npm/genlayer-js/+esm','https://cdn.jsdelivr.net/npm/genlayer-js/chains/+esm']];
    for(const[a,b]of src){try{const[x,y]=await tmo(Promise.all([import(a),import(b)]),12000);GL=x;CH=y;fillChains();chip('cSdk','ready','ok');return}catch(e){console.warn('SDK source failed',a,e)}}
    sdkP=null;chip('cSdk','failed, click to retry','bad');
    throw new Error('Could not load genlayer-js from esm.sh or jsDelivr. Check your network or proxy, then click the SDK chip to retry.');
  })();
}
function readCfg(){
  cfg.chain=$('#sChain').value;cfg.rpc=$('#iRpc').value.trim();cfg.pk=$('#iPk').value.trim();
  cfg.L=$('#iL').value.trim();cfg.P=$('#iP').value.trim();cfg.C=$('#iC').value.trim();
  for(const k of['chain','rpc','pk'])LS(k,cfg[k]);LS('addrL',cfg.L);LS('addrP',cfg.P);LS('addrC',cfg.C);
  for(const k of['L','P','C'])$('#i'+k).classList.toggle('bad',!!cfg[k]&&!ADDR.test(cfg[k]));
  $('#iPk').classList.toggle('bad',!!cfg.pk&&!PK.test(cfg.pk));
}
async function ensureClient(){
  readCfg();await loadSdk();
  const s=[cfg.chain,cfg.rpc,cfg.pk].join('|');
  if(client&&s===sig)return;
  if(cfg.pk&&!PK.test(cfg.pk))throw new Error('Private key must be 0x followed by 64 hex characters');
  if(!CH[cfg.chain])throw new Error('Unknown network: '+cfg.chain);
  const o={chain:CH[cfg.chain]};
  if(cfg.rpc)o.endpoint=cfg.rpc;
  if(cfg.pk){const a=GL.createAccount(cfg.pk);o.account=a;me=a.address}else me='';
  client=GL.createClient(o);
  if(!['studionet','localnet'].includes(cfg.chain)){try{await client.initializeConsensusSmartContract()}catch(e){console.warn(e)}}
  sig=s;head();
}
function head(){
  chip('cAcc',me?short(me):'none (read-only)',me?'ok':'');$('#cAcc b').title=me;
}
async function pollStatus(){
  const c=$('#cPause'),d=c.firstChild,b=c.querySelector('b');
  if(!client||!ADDR.test(cfg.P||'')){d.className='dot';b.textContent='protocol: no address';return}
  try{const r=ser(await client.readContract({address:cfg.P,functionName:'get_status',args:[]}));d.className='dot '+(r.paused?'paused':'on');b.textContent=r.paused?'protocol paused':'protocol running'}
  catch{d.className='dot';b.textContent='protocol: no response'}
}
async function connect(){
  say('');
  try{await ensureClient();await pollStatus()}catch(e){say(e.message)}
}

/* ========= 4. Running a method ========= */
async function parseArg(p,v){
  v=(v??'').trim();
  if(p.t==='b')return v==='true';
  if(p.t==='l'){if(!v)throw new Error(`${p.n}: list is empty`);let a;if(v[0]==='['){try{a=JSON.parse(v)}catch{throw new Error(`${p.n}: invalid JSON list`)}}else a=v.split(',').map(x=>x.trim()).filter(Boolean);if(!Array.isArray(a)||!a.length||a.some(x=>typeof x!=='string'))throw new Error(`${p.n}: list of strings required`);return a}
  if(['i','ts','v'].includes(p.t)){if(!/^-?\d+$/.test(v))throw new Error(`${p.n}: integer required`);return BigInt(v)}
  if(p.t==='a'&&!/^0x[0-9a-fA-F]{40}$/.test(v))throw new Error(`${p.n}: address like 0x… (40 hex)`);
  if(!v&&p.t!=='t')throw new Error(`${p.n}: field is empty`);
  return v;
}
function digest(r){
  const s=ser(r),lr=s?.consensus_data?.leader_receipt?.[0],res=lr?.result;
  return{status:s.statusName||s.status,exec:s.txExecutionResultName||lr?.execution_result,ret:res?.payload?.readable??res?.payload??null,err:lr?.genvm_result?.stderr||'',raw:s};
}
async function run(mt,vals){
  await ensureClient();
  const address=cfg[mt.c];
  if(!address)throw new Error(`Set the ${CN[mt.c]} address in the connection bar`);
  const args=[];let value=0n;
  for(let i=0;i<mt.ps.length;i++){const a=await parseArg(mt.ps[i],vals[i]);if(mt.k==='p')value=a;else args.push(a)}
  if(mt.k!=='w'&&mt.k!=='p'){const r=await client.readContract({address,functionName:mt.n,args});const data=ser(r);if(mt.n==='list_capabilities'&&data&&typeof data==='object')Object.keys(data).forEach(k=>{if(!CAPS.includes(k))CAPS.push(k)});return{kind:'r',data}}
  if(!cfg.pk)throw new Error('Writes need a private key: paste or generate one in the connection bar');
  const hash=await client.writeContract({address,functionName:mt.n,args,value});
  const rc=await client.waitForTransactionReceipt({hash,status:'ACCEPTED',retries:120,interval:3000});
  return{kind:'w',hash:String(hash),d:digest(rc)};
}



/* ========= 5. Interface ========= */
const key=mt=>mt.c+'.'+mt.n;
const glyph=k=>h('span',{class:'g '+(k==='r'?'':k)});
function renderNav(){
  const nav=$('#nav');nav.replaceChildren();
  const q=st.q.trim().toLowerCase(),cnt=c=>METHODS.filter(x=>x.c===c).length;
  nav.append(h('div',{class:'navtop'},
    h('div',{class:'tabs'},...['L','P','C'].map(c=>h('button',{class:st.tab===c?'on':'',onclick:()=>{st.tab=c;renderNav()}},TAB[c],h('small',{},cnt(c))))),
    h('input',{class:'q',id:'q',value:st.q,placeholder:'Search methods',autocomplete:'off',spellcheck:'false',oninput:e=>{st.q=e.target.value;renderNav();const i=$('#q');i.focus();i.setSelectionRange(i.value.length,i.value.length)}})));
  const list=METHODS.filter(x=>x.c===st.tab&&(!q||x.n.includes(q)));
  if(!list.length)nav.append(h('div',{class:'grp'},h('div',{class:'empty'},'No methods match.')));
  for(const g of [...new Set(list.map(x=>x.g))]){
    const ms=list.filter(x=>x.g===g);
    nav.append(h('div',{class:'grp'},h('h4',{},g,h('span',{},ms.length)),...ms.map(x=>h('button',{class:'m'+(st.sel&&key(st.sel)===key(x)?' on':''),onclick:()=>select(x)},glyph(x.k),x.n))));
  }
}
function select(mt,prefill){st.sel=mt;st.tab=mt.c;renderNav();renderForm(mt,prefill)}

function renderHome(){
  st.sel=null;renderNav();
  const n=c=>String(METHODS.filter(x=>x.c===c).length);
  $('#stage').replaceChildren(
    h('h1',{},'Authority console'),
    h('p',{class:'sub'},METHODS.length+' methods of three contracts in one window. Set the key and addresses in the bar above, pick a method on the left, and watch results on the tape at the right.'),
    h('div',{class:'cards'},
      h('div',{class:'card'},h('div',{class:'n'},n('L')),h('p',{},'AuthorityLedger: capabilities, consequence classes, exact action, verdicts, appeals, audit')),
      h('div',{class:'card'},h('div',{class:'n'},n('P')),h('p',{},'ProtectedProtocol: severity, pause by verdict, guardians, bonds, critical path')),
      h('div',{class:'card'},h('div',{class:'n'},n('C')),h('p',{},'ContinuityCore: verified facts with expiry, gate nodes, judges with golden cases'))),
    h('ol',{class:'fl'},
      h('li',{},'Deploy the contracts in Studio and paste their addresses into the bar above.'),
      h('li',{},'The owner calls ',h('b',{},'set_protected_protocol_address'),' and ',h('b',{},'set_ledger_address'),' (once each).'),
      h('li',{},'The owner adds reporters and guardians; reporters send ',h('b',{},'report_severity'),' more often than every 10 minutes.'),
      h('li',{},'create_delegation > create_request > adjudicate (if INCONCLUSIVE: appeal_verdict) > pause_via_verdict.'),
      h('li',{},'Gates: register_evidence > verify_evidence > derive_action in ContinuityCore, then set_continuity_address, require_gate_for_capability and create_request_gated in the Ledger.'),
      h('li',{},'Critical: canonical_threshold_payload > create_request_with_params (hash of that text) > adjudicate_action > propose_critical_threshold_change > approve_critical_action by guardians.')),
    h('div',{class:'f'},h('label',{},'Hasher: text to sha256 (for intent_hash and justification_hash)'),h('textarea',{id:'tHash',placeholder:'Paste text...'}),h('input',{id:'oHash',readonly:true,placeholder:'sha256 (click to copy)',style:'margin-top:8px',onclick:e=>{e.target.select();navigator.clipboard?.writeText(e.target.value)}})));
  $('#tHash').oninput=async e=>{$('#oHash').value=e.target.value?await sha(e.target.value):''};
}

function field(p,i,mt,pre){
  const id='p'+i,val=pre?.[i]??'';
  let el,extra=null;
  const chipBtn=(l,fn)=>h('button',{class:'btn ghost sm',type:'button',onclick:fn},l);
  if(p.t==='t')el=h('textarea',{id,spellcheck:'false'},val);
  else if(p.t==='b')el=h('select',{id},h('option',{value:'true'},'true'),h('option',{value:'false',selected:val==='false'},'false'));
  else if(p.t==='cap')el=h('input',{id,value:val||CAPS[0],list:'dlCaps',autocomplete:'off',spellcheck:'false',placeholder:'capability'});
  else{
    el=h('input',{id,value:val,autocomplete:'off',spellcheck:'false',inputmode:['i','ts','v'].includes(p.t)?'numeric':null,list:p.t==='id'?'dlIds':null,placeholder:{a:'0x...',h:'sha256 hex',id:'id',l:'["EV-1"] or EV-1, EV-2',ts:'unix, seconds',v:'wei',i:'number'}[p.t]||''});
    if(p.t==='a')extra=h('div',{class:'chips'},chipBtn('my address',()=>{el.value=me}),...[['L','Ledger'],['P','Protocol'],['C','Continuity']].map(([k,l])=>cfg[k]&&chipBtn(l,()=>{el.value=cfg[k]})));
    if(p.t==='ts')extra=h('div',{class:'chips'},...[['now',0],['+1 h',3600],['+1 day',86400],['+7 days',604800]].map(([l,s])=>chipBtn(l,()=>{el.value=Math.floor(Date.now()/1000)+s})));
    if(p.t==='v')extra=h('div',{class:'chips'},...[['0.1 GEN','100000000000000000'],['1 GEN','1000000000000000000']].map(([l,v])=>chipBtn(l,()=>{el.value=v})));
    if(p.t==='h')extra=h('div',{class:'hsrc'},h('textarea',{placeholder:'...or paste the source text, the hash fills itself',oninput:async e=>{if(e.target.value)el.value=await sha(e.target.value)}}));
  }
  return h('div',{class:'f'},h('label',{},p.n,h('span',{},{a:'address',h:'sha256',ts:'unix time',id:'id',v:'wei',i:'int',b:'bool',t:'text',s:'str',cap:'capability',l:'list'}[p.t])),el,extra);
}
function renderForm(mt,pre){
  const out=h('div',{id:'out'});
  const dl=h('div',{},h('datalist',{id:'dlIds'},...[...st.ids].reverse().map(i=>h('option',{value:i}))),h('datalist',{id:'dlCaps'},...CAPS.map(c=>h('option',{value:c}))));
  const btn=h('button',{class:'btn',onclick:async()=>{
    btn.disabled=true;
    const vals=mt.ps.map((_,i)=>$('#p'+i).value),e=addTape(mt,vals);
    try{const r=await run(mt,vals);finishTape(e,r);showOut(out,r)}
    catch(err){e.state='err';e.text=String(err.message||err);redrawTape();showOut(out,{kind:'e',msg:e.text})}
    btn.disabled=false;pollStatus();
  }},mt.k==='r'?'Read':mt.k==='p'?'Send with value':'Send transaction');
  $('#stage').replaceChildren(
    h('span',{class:'kind'},CN[mt.c]+' | '+(mt.k==='r'?'read, no signature':mt.k==='p'?'write, payable':'write, signed, goes through consensus')),
    h('h1',{style:'font-family:var(--mono);font-size:26px;word-break:break-all'},mt.n),
    h('p',{class:'sub'},mt.d),dl,
    ...mt.ps.map((p,i)=>field(p,i,mt,pre)),
    h('div',{class:'row'},btn,h('button',{class:'btn ghost',onclick:renderHome},'Home')),out);
}
function showOut(box,r){
  const copy=t=>h('button',{class:'btn ghost sm',onclick:()=>navigator.clipboard?.writeText(t)},'Copy');
  if(r.kind==='e'){box.replaceChildren(h('div',{class:'out err'},h('div',{},'Error'),h('pre',{},r.msg)));return}
  if(r.kind==='r'){scanIds(r.data);box.replaceChildren(h('div',{class:'out'},h('div',{},'Result',copy(pretty(r.data))),h('pre',{},pretty(r.data))));return}
  const d=r.d;scanIds(d.raw);
  const bad=/ERROR/.test(d.exec||''),body=d.ret!=null?pretty(d.ret):(d.err||'(method returned nothing)');
  box.replaceChildren(h('div',{class:'out'+(bad?' err':'')},
    h('div',{},h('span',{},`${d.status||'-'} | ${d.exec||'-'}`),h('span',{style:'font-family:var(--mono);font-size:12px;color:var(--mute)'},short(r.hash))),
    h('pre',{},body),
    h('details',{},h('summary',{},'tx hash and full receipt'),h('pre',{style:'padding:8px 0'},r.hash+'\n\n'+pretty(d.raw)))));
}

/* ========= 6. Call tape ========= */
function addTape(mt,vals){const e={id:++st.n,mt,vals,state:'pend',text:'',time:new Date()};st.tape.unshift(e);redrawTape();return e}
function finishTape(e,r){
  if(r.kind==='r'){e.state='ok';e.text=pretty(r.data)}
  else{const bad=/ERROR/.test(r.d.exec||'');e.state=bad?'err':'ok';e.text=`${r.d.status||''} ${r.d.exec||''}\n`+(r.d.ret!=null?pretty(r.d.ret):r.d.err)}
  redrawTape();
}
function redrawTape(){
  const box=$('#tape');
  if(!st.tape.length){box.replaceChildren(h('div',{class:'empty'},'Every call shows up here with method, time, status and result. Click an entry to reopen the method with the same arguments.'));return}
  box.replaceChildren(...st.tape.map(e=>h('div',{class:'t'+(e.state==='err'?' err':''),onclick:()=>select(e.mt,e.vals)},
    h('div',{class:'tn'},e.state==='pend'?h('span',{class:'spin'}):glyph(e.state==='err'?'r':'w'),e.mt.n),
    h('div',{class:'tm'},h('span',{},CN[e.mt.c]),h('span',{},e.state==='pend'?'waiting for consensus...':e.state==='err'?'error':'done',' | ',e.time.toLocaleTimeString())),
    e.text&&h('div',{class:'tr'},e.text))));
}

/* ========= 7. Start ========= */
$('#iRpc').value=cfg.rpc;$('#iPk').value=cfg.pk;$('#iL').value=cfg.L;$('#iP').value=cfg.P;$('#iC').value=cfg.C;
$('#sChain').value=cfg.chain;
for(const id of['sChain','iRpc','iPk','iL','iP','iC']){$('#'+id).addEventListener('input',readCfg);$('#'+id).addEventListener('keydown',e=>{if(e.key==='Enter')connect()})}
$('#bConn').onclick=connect;
$('#cSdk').onclick=()=>{if(!GL)connect()};
$('#bShow').onclick=e=>{const i=$('#iPk');i.type=i.type==='password'?'text':'password';e.target.textContent=i.type==='password'?'Show':'Hide'};
$('#bNew').onclick=()=>{const k=GL?.generatePrivateKey?GL.generatePrivateKey():hex(crypto.getRandomValues(new Uint8Array(32)));$('#iPk').value=k;readCfg()};
$('#bCol').onclick=()=>$('#conn').classList.toggle('closed');
$('#bClr').onclick=()=>{st.tape=[];redrawTape()};
if(matchMedia('(max-width:1100px)').matches&&cfg.pk&&cfg.L)$('#conn').classList.add('closed');
readCfg();renderNav();redrawTape();renderHome();
connect();
setInterval(pollStatus,20000);
</script>
</body>
